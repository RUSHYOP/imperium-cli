name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'imperium-docs-webiste/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: imperium-docs-webiste/package-lock.json

      - name: Install dependencies
        working-directory: imperium-docs-webiste
        run: npm ci

      - name: Generate static site
        working-directory: imperium-docs-webiste
        env:
          NUXT_PUBLIC_SITE_URL: https://imperium.dev
        run: npm run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy imperium-docs-webiste/.output/public --project-name=imperium-docs
